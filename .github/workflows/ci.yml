        timeout-minutes: 6
      - name: Upload normalized R4A receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.receipt_name }}
          path: artifacts/r4a/ci/r4a/verification/*.json
          if-no-files-found: error
          retention-days: 14

  r4a-cross-platform-receipt:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_tier == 'full' }}
    name: r4a-cross-platform-receipt
    needs: r4a-constrained-decisioning
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
      - name: Sync R4A comparator dependencies
        run: uv sync --locked --no-default-groups --group r4a
      - name: Download Linux receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r4a-receipt-linux-py313
          path: artifacts/r4a/receipts/linux
      - name: Download Windows receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r4a-receipt-windows-py313
          path: artifacts/r4a/receipts/windows
      - name: Compare normalized decision evidence
        run: >-
          uv run nexus r4a compare-platforms
          --left artifacts/r4a/receipts/linux/*.json
          --right artifacts/r4a/receipts/windows/*.json
