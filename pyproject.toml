[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexus-decision-intelligence"
version = "0.1.0"
description = "Governed supply-chain forecasting, decisioning, and human approval platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "NEXUS contributors" }]
dependencies = [
  "duckdb>=1.4,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.12,<3",
  "pyarrow>=18,<24",
  "pyyaml>=6,<7",
  "rich>=14,<15",
  "typer>=0.19,<1",
]

[project.scripts]
nexus = "nexus.cli:app"

[dependency-groups]
data = [
  "dbt-duckdb>=1.9,<2",
]
orchestration = [
  "dagster>=1.13.14,<1.14",
  "dagster-postgres>=0.29.14,<0.30",
  "psutil>=7.2,<8",
]
modeling = [
  "lightgbm>=4.7,<4.8",
  "numpy>=2.1,<3",
]
tracking = [
  "mlflow>=3.17.2,<3.18",
]
r3b = [
  { include-group = "modeling" },
  { include-group = "tracking" },
  "psutil>=7.2,<8",
]
r4a = [
  "ortools>=9.15,<9.16",
]
portfolio = [
  { include-group = "data" },
  { include-group = "r4a" },
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pyjwt>=2.15,<3",
]
dev = [
  "hypothesis>=6.140,<7",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-jsonschema>=4.25,<5",
  "types-psutil>=7.2,<8",
  "types-pyyaml>=6.0.12,<7",
]
r2d-service = [
    "confluent-kafka>=2.15,<3",
    "psycopg[binary]>=3.3,<4",
]
service = [
  { include-group = "portfolio" },
  { include-group = "r2d-service" },
  "psutil>=7.2,<8",
]

[tool.uv]
# Patched-version floors from release dependency audits.
# See docs/security/DEPENDENCIES.md for the latest scan and local MLflow scope.
constraint-dependencies = [
  "aiohttp>=3.14.4",
  "certifi>=2026.10.19",
  "cryptography>=50",
  "filelock>=4.2.1",
  "gitpython>=3.2.1",
  "graphql-core>=3.2.12",
  "mako>=1.4.2",
  "mlflow>=3.17.2",
  "msgpack>=1.2.3",
  "multidict>=6.9.1",
  "opentelemetry-api>=1.45.2",
  "pillow>=13",
  "pyasn1>=0.6.5",
  "pyjwt>=2.15",
  "sqlparse>=0.6",
  "urllib3>=2.8",
  "werkzeug>=3.1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.hatch.build.targets.wheel.force-include]
# The source remains canonical; wheels carry the same bytes as package resources.
"infra/postgres/migrations" = "nexus/portfolio/sql_migrations"

[tool.hatch.build.targets.sdist]
# Do not walk local caches, retained service evidence, or virtual environments.
only-include = [
  "src", "tests", "configs", "contracts", "dbt", "docs", "fixtures", "infra", "scripts",
  ".github", "README.md", "LICENSE", "pyproject.toml", "uv.lock", ".env.example",
  ".python-version", ".editorconfig", ".gitattributes", ".gitignore",
  "data/.gitkeep", "artifacts/.gitkeep",
]
skip-excluded-dirs = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "r2d: portable R2D-A1 event-path tests",
  "r2d_acceptance: complete two-replay portable R2D-A1 verification tests",
  "r2d_integration: expensive portable R2D-A1 semantic integration tests",
  "r2d_service: real service-backed R2D-A2/B2 tests; run only in dedicated Compose lanes",
  "portfolio_service: real isolated PostgreSQL operational foundation; explicit local opt-in",
  "r3b: bounded learned-intelligence tests requiring the optional R3B dependency group",
  "r3b_acceptance: complete two-replay R3B verification tests",
  "r4a: bounded constrained-decisioning tests requiring the optional R4A dependency group",
]
  # Gate coordinators are exercised by dedicated executable acceptance jobs.

[tool.coverage.run]
branch = true
source = ["nexus"]
omit = [
  "src/nexus/r2d.py",
  "src/nexus/r2d_a2a.py",
  "src/nexus/r2d_a2b.py",
  "src/nexus/r2d_a2b2.py",
  "src/nexus/r2d_b2b.py",
  "src/nexus/ingestion/r2d_a2_contracts.py",
  "src/nexus/ingestion/r2d_a2b_contracts.py",
  "src/nexus/ingestion/r2d_service.py",
  "src/nexus/ingestion/r2d_service_contracts.py",
  "src/nexus/r3b.py",
  "src/nexus/modeling/r3b_*.py",
  "src/nexus/r4a.py",
  "src/nexus/decisioning/r4a_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nexus"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["lightgbm", "lightgbm.*", "mlflow", "mlflow.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nexus.ingestion.r2d_service"]
warn_unused_ignores = false
