# Isolated bridge acceptance only; not the complete flagship operations profile.
name: nexus-flagship-broker-20260925
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda@sha256:8cb52078690728e2b3d1507fc84eda4c07d4d59bd8fa241e9b1cc7eb7de096c9
    pull_policy: never
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 768M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:9092"
      - "127.0.0.1:19644:9644"
    volumes:
      - broker-evidence:/var/lib/redpanda/data
    mem_limit: 1g
    cpus: 1
    labels:
      nexus.purpose: isolated-flagship-broker-acceptance
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  broker-evidence:
