name: nexus-r0

services:
  postgres:
    image: postgres:17.6-alpine
    profiles: ["ops"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    ports:
      - "127.0.0.1:${NEXUS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - nexus-postgres:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.9
    profiles: ["ops"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - nexus-redpanda:/var/lib/redpanda/data
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nexus-prometheus:/prometheus
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-nexus}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-only-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - nexus-grafana:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

volumes:
  nexus-postgres:
  nexus-redpanda:
  nexus-prometheus:
  nexus-grafana:
